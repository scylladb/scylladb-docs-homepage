[project]
name = "scylla"
description = "ScyllaDB Documentation Homepage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pygments>=2.18.0",
    "sphinx-scylladb-theme>=1.10.0,<1.11",
    "sphinx-sitemap>=2.9.0",
    "sphinx-autobuild>=2025.08.25",
    "sphinx>=9.1.1,<10",
    "sphinx-multiversion-scylla>=0.3.9",
    "redirects_cli>=0.1.3",
    "sphinxcontrib-datatemplates>=0.11.0",
]

[tool.uv]
package = false
# Resolve only releases that have been on PyPI for at least a week, so that a
# compromised release is usually caught and removed before we pick it up.
# ScyllaDB's own packages are exempt. To take a security fix younger than a
# week, add `<package> = false` below until the fix is a week old.
exclude-newer = "7 days"
exclude-newer-package = { sphinx-scylladb-theme = false, sphinx-multiversion-scylla = false }
