name: "Docs / Build PR"
# For more information,
# see https://sphinx-theme.scylladb.com/stable/deployment/production.html#available-workflows

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "uv.lock"
      - ".github/workflows/docs-pr.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up env
        run: make -C docs setupenv

      # Audits the committed lockfile before the build's `uv sync` can rewrite it.
      # The build still runs; the last step fails the check if this one failed.
      # The docs report shows only build diagnostics, so the audit writes its own summary.
      - name: Audit dependencies for known vulnerabilities
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          if ! make -C docs audit > "$RUNNER_TEMP/docs-audit.log" 2>&1; then
            cat "$RUNNER_TEMP/docs-audit.log"
            {
              echo "### Dependency audit failed"
              echo
              sed 's/^/    /' "$RUNNER_TEMP/docs-audit.log"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$RUNNER_TEMP/docs-audit.log"

      - name: Check redirects
        run: make -C docs check-redirects

      - name: Build docs
        id: docs-build
        shell: bash
        run: |
          make -C docs test SPHINXOPTS="-j auto -w $RUNNER_TEMP/docs-warnings.log" \
            2>&1 | tee "$RUNNER_TEMP/docs-build.log"

      - name: Summarize docs diagnostics
        if: always()
        uses: scylladb/sphinx-scylladb-theme/.github/actions/docs-report@0d821fc4038ee9ad6363362c02035132489bf3f6
        with:
          # A failed audit fails the check, so the report must not say it passed.
          build-outcome: ${{ steps.audit.outcome == 'failure' && 'failure' || steps.docs-build.outcome }}

      - name: Fail on known vulnerabilities
        if: ${{ !cancelled() && steps.audit.outcome == 'failure' }}
        run: |
          echo "::error::The docs dependencies have known vulnerabilities or an outdated lockfile. See the audit step and the job summary."
          exit 1
